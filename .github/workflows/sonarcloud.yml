# SonarCloud scan for the entire monorepo.
#
# Runs on every PR and push to main that touches Go code. Downloads the
# per-module coverage artifacts produced by the reusable build workflow,
# merges them into a single file with repo-root-relative paths, and hands
# the result to the SonarCloud scanner.
name: SonarCloud Scan

on:
  pull_request:
    paths:
      - "apps/**"
      - "pkg/**"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "pkg/**"
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud needs full history for blame/PR analysis

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      # Run tests with coverage for every module, merging into one file.
      # Each module's coverage.out uses paths relative to that module's
      # directory, so we prefix them with the module path to make them
      # repo-root-relative before appending to the merged file.
      - name: Test all modules with coverage
        run: |
          > coverage.out
          for mod in pkg apps/user-service apps/daily-service apps/ship-service apps/expedition-service; do
            if [ -f "$mod/go.mod" ]; then
              echo "Testing $mod..."
              (cd "$mod" && go test -coverprofile=coverage.out -covermode=atomic ./...)
              sed "s|^|$mod/|" "$mod/coverage.out" >> coverage.out
            fi
          done

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
