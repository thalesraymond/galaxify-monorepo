# CI for the web-frontend app.
#
# Runs the universal frontend gate (docs/specs/web-frontend-delivery.md §5):
# formatting, strict types, zero-warning lint, coverage, production build,
# mock-backed E2E, accessibility, visual regression, and performance. All E2E
# journeys are MSW-backed (the real stack is never required in CI).
#
# Dependency-propagation rule: the gate also consumes repository inputs
# outside apps/web-frontend — docs/openapi/*.yaml via `api:check` and the
# root scripts/dev.test.mjs via `test:orchestration` — so changes to those
# paths trigger the gate too.
name: CI web-frontend

on:
  pull_request:
    paths:
      - 'apps/web-frontend/**'
      - 'docs/openapi/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'apps/web-frontend/**'
      - 'docs/openapi/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ci-web-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.filter.outputs.affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Base ref: PR base commit for pull requests, the pre-push commit for
      # pushes to main, and the default branch for manual dispatches.
      - name: Detect changes vs base
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          filters: |
            affected:
              - 'apps/web-frontend/**'
              - 'docs/openapi/**'
              - 'scripts/**'

  gate:
    name: Frontend gate
    needs: changes
    if: needs.changes.outputs.affected == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web-frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the full frontend gate
        working-directory: apps/web-frontend
        run: npm run verify
