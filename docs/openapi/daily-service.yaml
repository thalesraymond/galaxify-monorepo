openapi: 3.1.0
info:
  title: Galaxify Daily Service API
  version: 0.1.0
  description: |
    HTTP wire contract for the Galaxify Daily Service (Phase 1).

    The browser reaches this service through the Vite dev proxy at
    `/api/daily`; the local direct origin is `http://localhost:8082` (see
    `x-local-origin`). `servers` is intentionally omitted so relative-path
    conformance checks do not depend on a host.

    Every `/dailies*` operation requires a bearer access token. Error responses
    use the shared envelope; branch on `error.code`, not on HTTP status.
    `X-Request-Id` is present on every response.

    `x-implementation-status: planned` marks locked Phase 1 contract changes
    that the Go handlers do not implement yet.
  contact:
    name: Galaxify
x-service-name: daily-service
x-local-origin: http://localhost:8082
tags:
  - name: health
    description: Liveness.
  - name: dailies
    description: Recurring Player Dailies and their history.

paths:
  /health:
    get:
      operationId: dailyHealth
      summary: Liveness check.
      tags: [health]
      x-implementation-status: implemented
      responses:
        "200":
          description: The service is running.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/Error"

  /dailies:
    post:
      operationId: dailyCreate
      summary: Create a new recurring Daily.
      tags: [dailies]
      x-implementation-status: implemented
      x-ticket: "#148, #151"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDailyRequest"
      responses:
        "201":
          description: Daily created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Daily"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DailyNotReady"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: dailyList
      summary: List the authenticated Player's current-cycle Dailies.
      description: |
        Filter by `status` and an optional `[from, to)` range of explicit RFC3339
        instants. The legacy `date` (UTC calendar day) and `due_date` (inclusive
        RFC3339 instant) filters remain supported for compatibility. Filtering is
        ownership-scoped before applying any range.
      tags: [dailies]
      x-implementation-status: implemented
      x-ticket: "#148"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DailyStatus"
        - name: from
          in: query
          required: false
          description: Inclusive lower bound instant (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound instant (RFC3339).
          schema:
            type: string
            format: date-time
        - name: date
          in: query
          required: false
          deprecated: true
          description: >-
            Legacy filter superseded by explicit RFC3339 `from`/`to`. Accepts a
            `YYYY-MM-DD` date or an RFC3339 instant and selects that UTC calendar
            day. `date` wins over its `due_date` alias.
          schema:
            $ref: "#/components/schemas/DateOrDateTime"
        - name: due_date
          in: query
          required: false
          deprecated: true
          description: Legacy alias for `date`, used only when `date` is absent.
          schema:
            $ref: "#/components/schemas/DateOrDateTime"
      responses:
        "200":
          description: Current-cycle Dailies.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Daily"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DailyNotReady"
        default:
          $ref: "#/components/responses/Error"

  /dailies/history:
    get:
      operationId: dailyHistory
      summary: List archived Daily outcomes, newest first.
      description: |
        Returns one stable descending cursor page ordered by occurrence
        (`due_date`), then archive time, then record id as the unique
        tie-breaker. `next_cursor` is `null` exactly on the final page; pass it
        back as `cursor` to continue without duplicates or omissions. An
        invalid or tampered cursor returns `422 VALIDATION_FAILED` with a
        `cursor` field error.
      tags: [dailies]
      x-implementation-status: implemented
      x-ticket: "#150"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: cursor
          in: query
          required: false
          description: Opaque continuation token from a previous page's `next_cursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 20 and is capped at 100.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: One stable descending page of archived Daily outcomes.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DailyNotReady"
        default:
          $ref: "#/components/responses/Error"

  /dailies/difficulties:
    get:
      operationId: dailyDifficulties
      summary: Return typed reward and damage metadata for each difficulty.
      description: |
        Backend-owned difficulty metadata so the frontend never duplicates
        reward/damage rules. Tiers are returned in canonical EASY, MEDIUM, HARD
        order. The same `difficulty_rewards` rows back the awarded-material
        effect of completion.
      tags: [dailies]
      x-implementation-status: implemented
      x-ticket: "#151"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Difficulty metadata.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyDifficulty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/Error"

  /dailies/{id}:
    parameters:
      - $ref: "#/components/parameters/DailyId"
    get:
      operationId: dailyGet
      summary: Return one Daily owned by the authenticated Player.
      tags: [dailies]
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: The Daily.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Daily"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DailyNotReady"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: dailyUpdate
      summary: Edit a Daily.
      description: >-
        Updates the recurring Daily for future cycles even when today's
        occurrence is COMPLETED. Existing Daily History records are unchanged.
      tags: [dailies]
      x-implementation-status: implemented
      x-planned-changes: >-
        Permit edit after today's completion while preserving history.
        Accept an IANA time_zone plus local deadline.
      x-ticket: "#147, #148"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDailyRequest"
      responses:
        "200":
          description: The updated Daily.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Daily"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: dailyDelete
      summary: Delete a recurring Daily.
      description: >-
        Deletes the recurring Daily even when today's occurrence is COMPLETED.
        Existing Daily History records are unchanged.
      tags: [dailies]
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "204":
          description: Daily deleted. No body.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        default:
          $ref: "#/components/responses/Error"

  /dailies/{id}/complete:
    post:
      operationId: dailyComplete
      summary: Mark a Daily COMPLETED for today.
      description: >-
        Marks the Daily COMPLETED, records its history occurrence, and returns
        the completed Daily with the typed awarded-material effect. Repeating a
        completion for an already-completed Daily returns 409
        DAILY_ALREADY_COMPLETED and awards no further materials.
      tags: [dailies]
      x-implementation-status: implemented
      x-ticket: "#151"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/DailyId"
      responses:
        "200":
          description: The completed Daily with its awarded-material effect.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCompletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DailyNotReady"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA (Ed25519) access token issued by the User Service.

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional correlation ID; a UUID v4 is generated when absent.
      schema:
        type: string
        format: uuid
    DailyId:
      name: id
      in: path
      required: true
      description: Daily UUID.
      schema:
        type: string
        format: uuid

  headers:
    XRequestId:
      description: Correlation ID echoed on every response.
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          examples: [daily-service]

    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]

    DailyStatus:
      type: string
      enum: [PENDING, COMPLETED, MISSED]

    DateOrDateTime:
      description: A `YYYY-MM-DD` date or an RFC3339 date-time.
      oneOf:
        - type: string
          format: date
        - type: string
          format: date-time

    ClockTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Local wall-clock time in HH:MM.

    CreateDailyRequest:
      type: object
      required: [title, difficulty, time_zone]
      anyOf:
        - required: [due_date]
        - required: [due_local_date, due_local_time]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        due_date:
          type: string
          format: date-time
          deprecated: true
          description: >-
            Legacy RFC3339 deadline instant. New clients should send
            `due_local_date` + `due_local_time` + `time_zone` and let the backend
            resolve DST.
        time_zone:
          type: string
          description: IANA time zone retained across recurrence, e.g. Europe/Paris.
        due_local_date:
          type: string
          format: date
          description: Local calendar date paired with `due_local_time` and `time_zone`.
        due_local_time:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: >-
            Local wall-clock deadline resolved by the backend using `time_zone`.
            An ambiguous fall-back time selects its first occurrence; a
            nonexistent spring-forward time moves to the first valid local
            instant after it.

    UpdateDailyRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        due_date:
          type: string
          format: date-time
          deprecated: true
          description: Legacy RFC3339 deadline instant; prefer the local deadline pair.
        time_zone:
          type: string
          description: Replacement IANA time zone. Omit to retain the configured zone.
        due_local_date:
          type: string
          format: date
          description: Local calendar date; requires `due_local_time` and `time_zone`.
        due_local_time:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Local wall-clock deadline; requires `due_local_date` and `time_zone`.

    Daily:
      type: object
      required:
        [id, user_id, title, description, difficulty, due_date, time_zone, due_local_date, due_local_time, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        due_date:
          type: string
          format: date-time
          description: RFC3339 timestamp (UTC).
        status:
          $ref: "#/components/schemas/DailyStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        time_zone:
          type: string
          description: IANA zone retained until explicitly edited.
        due_local_date:
          type: string
          format: date
          description: Local deadline calendar date derived from `due_date` in `time_zone`.
        due_local_time:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Local deadline wall-clock time derived from `due_date` in `time_zone`.

    DailyHistory:
      type: object
      required:
        [id, daily_id, user_id, title, description, difficulty, due_date, time_zone, due_local_date, due_local_time, status, completed_at, missed_at, archived_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        daily_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        due_date:
          type: string
          format: date-time
        time_zone:
          type: string
          description: IANA zone snapshot for grouping and display of this occurrence.
        due_local_date:
          type: string
          format: date
          description: Local occurrence calendar date derived from `due_date` in `time_zone`.
        due_local_time:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Local occurrence wall-clock time derived from `due_date` in `time_zone`.
        status:
          $ref: "#/components/schemas/DailyStatus"
        completed_at:
          type: [string, "null"]
          format: date-time
        missed_at:
          type: [string, "null"]
          format: date-time
        archived_at:
          type: string
          format: date-time

    DailyHistoryPage:
      type: object
      description: One stable descending page of Daily history.
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DailyHistory"
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; null on the final page.

    DailyDifficulty:
      type: object
      description: Backend-owned reward and missed-hull-damage metadata for one tier.
      required: [difficulty, reward_materials, damage_amount]
      additionalProperties: false
      properties:
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        reward_materials:
          type: integer
          format: int32
        damage_amount:
          type: integer
          format: int32

    MaterialEffect:
      type: object
      description: >-
        Planned reusable typed effect. Reserved for Daily History's typed
        effects; completion reports its award as `awarded_materials`.
      x-implementation-status: planned
      required: [kind, materials]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [MATERIALS]
        materials:
          type: integer
          format: int32

    DailyCompletion:
      type: object
      description: >-
        The completed Daily plus the typed awarded-material effect, so clients
        can reconcile the mutated Daily and the award from one response.
      required:
        [id, user_id, title, description, difficulty, due_date, time_zone, due_local_date, due_local_time, status, created_at, updated_at, awarded_materials]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        due_date:
          type: string
          format: date-time
        time_zone:
          type: string
          description: IANA zone retained until explicitly edited.
        due_local_date:
          type: string
          format: date
          description: Local deadline calendar date derived from `due_date` in `time_zone`.
        due_local_time:
          allOf:
            - $ref: "#/components/schemas/ClockTime"
          description: Local deadline wall-clock time derived from `due_date` in `time_zone`.
        status:
          $ref: "#/components/schemas/DailyStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        awarded_materials:
          type: integer
          format: int32
          description: Materials awarded, sourced from the difficulty reward table.

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"

    ErrorDetails:
      type: object
      required: [field_errors]
      additionalProperties: false
      properties:
        field_errors:
          type: object
          additionalProperties:
            type: string

  responses:
    Unauthorized:
      description: >-
        Request is not authenticated. Codes: AUTH_MISSING_HEADER,
        AUTH_INVALID_TOKEN, AUTH_MISSING_KID, AUTH_UNKNOWN_KID.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationFailed:
      description: >-
        Request validation failed. `details.field_errors` is populated; the
        malformed-JSON field is `body`.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: The Daily does not exist. Code DAILY_NOT_FOUND.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: >-
        The Daily is not mutable in its current state. Codes:
        DAILY_ALREADY_COMPLETED.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    DailyNotReady:
      description: >-
        Service-specific retryable not-ready error while the Player's Daily
        state provisions. Code DAILY_PLAYER_NOT_READY; retry after provisioning.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Unexpected server error. Code INTERNAL_ERROR.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Error:
      description: Any error not covered by a more specific response.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
