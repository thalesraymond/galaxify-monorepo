# SonarCloud project configuration for the galaxify-monorepo.
#
# Single SonarCloud project covering all Go modules. Coverage is merged
# from every module in the sonarcloud.yml workflow before the scan runs.

sonar.projectKey=thalesraymond_galaxify-monorepo
sonar.organization=thalesraymond

# Source encoding
sonar.sourceEncoding=UTF-8

# Go source and test paths (relative to repo root)
sonar.sources=apps,pkg
sonar.tests=apps,pkg
sonar.test.inclusions=**/*_test.go

# Merged coverage report (produced by the sonarcloud.yml workflow)
sonar.go.coverage.reportPaths=coverage.out

# Exclude generated code (sqlc output, database layer)
sonar.exclusions=**/internal/database/*.go, **/*_test.go
